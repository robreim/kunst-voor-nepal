<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="CMS_CONFIG_URL" content="config.local.yml" />
    <title>Beheer — Kunst voor Nepal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Caveat:wght@400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/decap-cms@3.0.0/dist/decap-cms.css" />
    <link rel="stylesheet" href="/styles/global.css" />
    <style>
      /* Centrering alleen voor de inlog-kaart; moet weg zodra de CMS
         interface (Decap) mount — anders breekt de hele layout. */
      .auth-wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
      }
      body { margin: 0; background: var(--paper); color: var(--ink); }
      .auth-card {
        width: 100%;
        max-width: 26rem;
        background: var(--paper);
        border: 2px solid var(--ink);
        border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
        padding: 2.5rem 2rem;
        text-align: center;
      }
      .auth-card h1 {
        font-family: 'Caveat', cursive;
        font-size: 2.4rem;
        font-weight: 700;
        margin: 0 0 0.25rem;
        transform: rotate(-2deg);
      }
      .auth-card p.lead {
        color: var(--ink-soft);
        margin: 0 0 1.5rem;
      }
      .auth-card form {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .auth-card input {
        font-family: inherit;
        font-size: 1rem;
        padding: 0.7rem 0.9rem;
        border: 2px solid var(--ink);
        border-radius: 12px 8px 12px 8px;
        background: #fff;
        color: var(--ink);
        width: 100%;
      }
      .auth-card input:focus {
        outline: none;
        box-shadow: inset 0 0 0 2px var(--ember);
      }
      .auth-card .status {
        min-height: 1.6rem;
        font-size: 0.95rem;
        color: var(--teal);
        font-weight: 600;
      }
      .auth-card .status.error { color: var(--ember-deep); }
      .btn--ember { border: 2px solid var(--ember); }
      .hint {
        font-size: 0.85rem;
        color: var(--ink-soft);
        margin: 0.4rem 0 0;
      }
      .back-link {
        display: inline-block;
        margin-top: 1.5rem;
        color: var(--ink-soft);
        text-decoration: underline dotted;
      }
      /* Verberg de zwevende Netlify-login-knop/menu over de CMS-interface:
         uitloggen gaat via Decap zelf (sidebar) of door de widget weer te tonen. */
      .netlify-identity-button {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="auth-wrap">
    <div class="auth-card">
      <h1>Kunst voor Nepal</h1>
      <p class="lead">Beheer — kunstwerken, verhaal en instellingen</p>
      <form id="login-form" novalidate>
        <input type="email" id="email" name="email" placeholder="Je e-mailadres" autocomplete="email" required />
        <input type="password" id="password" name="password" placeholder="Je wachtwoord" autocomplete="current-password" required />
        <button type="submit" class="btn btn--ember" id="submit-btn">Inloggen</button>
      </form>
      <p class="hint">Geen wachtwoord (nog)? Open dan de uitnodigingslink uit je e-mail — daar kies je er een.</p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <a class="back-link" href="/">← terug naar de site</a>
    </div>
    </div>
    <script>
      // Laad de Netlify Identity widget alleen in productie (niet lokaal):
      // de widget boot zichzelf op bij het laden en opent lokaal een login-modal
      // bovenop de CMS-interface, terwijl lokaal de lokale backend geldt.
      if (!/localhost|127\.0\.0\.1|0\.0\.0\.0/.test(location.hostname)) {
        var s = document.createElement('script');
        s.src = 'https://unpkg.com/netlify-identity-widget@1.9.2/build/netlify-identity-widget.js';
        document.head.appendChild(s);
      }
    </script>
    <script src="https://unpkg.com/decap-cms@3.0.0/dist/decap-cms.js"></script>
    <script>
      // ── Inloggen met e-mail + wachtwoord voor kunstvoornepal.nl/admin ──
      // Een uitnodigingslink (#invite_token=...) laat de widget zelf om een
      // wachtwoord vragen ("Complete your signup") — Netlify vereist dat bij
      // het accepteren van een uitnodiging. Daarna log je gewoon in.
      (function () {
        var form = document.getElementById('login-form');
        var emailInput = document.getElementById('email');
        var passwordInput = document.getElementById('password');
        var submitBtn = document.getElementById('submit-btn');
        var status = document.getElementById('status');
        var widgetReady = false;
        var started = false;
        var pendingToken = (location.hash || '').match(/(recovery|invite)_token=([^&]+)/);
        // Lokaal (localhost/127.0.0.1) is er géén Netlify Identity — Decap
        // gebruikt dan de lokale backend (decap-server op :8081) zónder login.
        var isLocal = /localhost|127\.0\.0\.1|0\.0\.0\.0/.test(location.hostname);

        function setStatus(msg, isError) {
          status.textContent = msg || '';
          status.classList.toggle('error', !!isError);
        }

        function errMsg(err) {
          return (err && (err.msg || err.message)) ? (err.msg || err.message) : 'probeer het nog eens.';
        }

        // Belt CMS één keer; roept de widget NIET opnieuw op (dubbele init
        // van de widget scheurt de Decap-DOM af → removeChild-crash).
        function startDecap() {
          if (started) return;
          started = true;
          // Verberg de hele inlog-wrap (kaart + centrering) zodra de
          // CMS-interface start — anders breekt de Decap-layout.
          var wrap = document.querySelector('.auth-wrap');
          if (wrap) wrap.style.display = 'none';
          try {
            if (window.CMS) {
              registerNumberHook();
              window.CMS.init();
            }
            setStatus('');
          } catch (e) {
            setStatus('Beheer kon niet starten. Ververs de pagina of neem contact op.', true);
          }
        }

        // Registers a preSave hook: before an artwork is committed, if it has
        // no number yet, generate a unique "X548" code (letter + 3 digits) that
        // doesn't collide with any existing artwork. Runs synchronously at save
        // time against the real entry list — no race, truly invisible to the
        // artist (the field is widget: hidden, so Decap renders no row at all).
        function registerNumberHook() {
          var letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
          function gen() {
            var l = letters[Math.floor(Math.random() * letters.length)];
            var n = 105 + Math.floor(Math.random() * 895);
            return l + n;
          }
          try {
            window.CMS.registerEventListener({
              name: 'preSave',
              handler: function (_opts) {
                // _opts: { entry, collection, ... }. Generate only if empty.
                var entry = _opts && _opts.entry;
                var data = entry && entry.get ? entry.get('data') : null;
                if (!data || data.get('number')) return;
                var taken = {};
                try {
                  var backend = window.CMS.getBackend && window.CMS.getBackend();
                  var col = backend && backend.getCollection && backend.getCollection('artworks');
                  if (col && col.get && col.getEntries) {
                    col.getEntries().then(function (entries) {
                      entries.forEach(function (e) {
                        var n = e && e.data && e.data.number;
                        if (n) taken[n] = true;
                      });
                      var code = gen();
                      while (taken[code]) { code = gen(); }
                      if (data.set) data.set('number', code);
                    });
                  } else {
                    var code2 = gen();
                    if (data.set) data.set('number', code2);
                  }
                } catch (e) {
                  var code3 = gen();
                  if (data && data.set) data.set('number', code3);
                }
              },
            });
          } catch (e) { /* preSave not available; artist must have a number */ }
        }

        // LOKAAL: geen Netlify-Identity — start de widget NIET (zijn login-modal
        // zou bovenop de CMS-interface verschijnen) en mount de CMS direct met
        // de lokale backend (decap-server :8081). Wacht tot Decap geladen is.
        if (isLocal) {
          var tries = 0;
          (function waitCMS() {
            if (window.CMS) { startDecap(); return; }
            if (++tries < 100) setTimeout(waitCMS, 200);
          })();
        } else {
          // Widget precies één keer initialiseren (alleen in productie).
          window.netlifyIdentity.on('init', function () {
            widgetReady = true;
          });
          window.netlifyIdentity.init();

          function maybeStart() {
            if (window.netlifyIdentity.currentUser()) {
              startDecap();
            }
          }
          window.netlifyIdentity.on('login', maybeStart);
          window.netlifyIdentity.on('logout', function () {
            started = false;
          });

          // Al ingelogd via een eerdere sessie → direct de CMS-interface tonen.
          if (window.netlifyIdentity.currentUser()) {
            startDecap();
          } else if (pendingToken) {
            // Uitnodigings- of recovery-link: de widget toont zelf het scherm
            // waar je een wachtwoord kiest / opnieuw instelt.
            window.netlifyIdentity.on('init', function () {
              window.netlifyIdentity.handleAuthCallback();
            });
            window.netlifyIdentity.on('login', function () {
              startDecap();
            });
          }
        }

        function onWidgetReady(fn) {
          if (widgetReady) return fn();
          window.netlifyIdentity.on('init', fn);
        }

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var email = emailInput.value.trim();
          var password = passwordInput.value;
          if (!email || !password) {
            setStatus('Vul je e-mailadres en wachtwoord in.', true);
            return;
          }
          // Lokaal: geen Netlify-login nodig (lokale backend).
          if (isLocal) return;
          submitBtn.disabled = true;
          setStatus('Inloggen…');
          onWidgetReady(function () {
            // De widget zelf heeft géén openbare .login() — de goTrue-client
            // (zelfde code als het widget-modal) doet het echte werk.
            window.netlifyIdentity.gotrue
              .login(email, password, true)
              .then(function () {
                startDecap();
              })
              .catch(function (err) {
                setStatus('Inloggen mislukt: ' + errMsg(err), true);
                submitBtn.disabled = false;
              });
          });
        });
      })();
    </script>
  </body>
</html>
