# Decap CMS config — Kunst voor Nepal
# See https://decapcms.org/docs/ for reference.

backend:
  name: git-gateway
  branch: accept

# Local preview when running `npm run dev` (no Netlify auth needed).
local_backend: true

media_folder: "public/art"
public_folder: "/art"
site_url: https://kunstvoornepal.nl

# Dutch admin UI (Decap ships a built-in nl locale).
locale: nl

collections:
  # ── Kunstwerken: one file per artwork ──────────────────────────────
  - name: "artworks"
    label: "Kunstwerken"
    label_singular: "Kunstwerk"
    folder: "src/content/artworks"
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "galerij"
    summary: "{{number}} · {{title}} — {{artist}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Kunstenaar", name: "artist", widget: "string" }
      - label: "Nummer (automatisch)"
        name: "number"
        widget: "hidden"
        default: ""
        hint: "Wordt automatisch gegenereerd (bijv. X548). Onzichtbaar."
      - { label: "Foto", name: "image", widget: "image" }
      - { label: "Breedte (cm)", name: "breedteCm", widget: "number", value_type: "int", min: 1, required: true, hint: "Breedte van het kunstwerk in centimeters." }
      - { label: "Hoogte (cm)", name: "hoogteCm", widget: "number", value_type: "int", min: 1, required: true, hint: "Hoogte van het kunstwerk in centimeters." }
      - { label: "Minimumprijs (euro)", name: "minimumprijs", widget: "number", value_type: "float", min: 0, required: true, hint: "Laagste prijs waarvoor het werk mag worden verkocht." }
      - label: "Formaat (liggend/staand)"
        name: "orientatie"
        widget: "select"
        options: ["liggend", "staand", "vierkant"]
        default: "liggend"
        required: false
        hint: "Bepaalt de vorm van de kaart in de galerij. Staat je werk hoger dan breed? Kies dan 'staand'."
      - { label: "Materiaal", name: "materiaal", widget: "string", required: false, hint: "Bijv. aquarel op papier, acryl op doek…" }
      - { label: "Omschrijving", name: "body", widget: "markdown", required: false }

  # ── Verhaal: the front-page story ──────────────────────────────────
  - name: "verhaal"
    label: "Verhaal"
    files:
      - label: "Voorpagina-verhaal"
        name: "story"
        file: "src/content/story/story.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Intro (korte lead)", name: "lead", widget: "text" }
          - { label: "Verhaal", name: "body", widget: "markdown" }

  # ── Instellingen: global settings (Tikkie-link etc.) ─────────────
  - name: "instellingen"
    label: "Instellingen"
    media_folder: "public/img"
    public_folder: "/img"
    files:
      - label: "Algemene instellingen"
        name: "global"
        file: "src/content/settings/global.json"
        fields:
          - { label: "Sitenaam", name: "siteTitle", widget: "string" }
          - { label: "Tikkie betaallink (URL)", name: "tikkieUrl", widget: "string", hint: "De Tikkie-link voor donaties. Staat op de doneerpagina." }
          - { label: "Contact-e-mailadres", name: "contactEmail", widget: "string" }
          - { label: "Voettekst", name: "footerNote", widget: "text" }
