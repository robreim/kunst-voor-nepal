# Decap CMS config — Kunst voor Nepal
# See https://decapcms.org/docs/ for reference.

backend:
  name: test-repo
  branch: main
  login: false

# Local preview when running `npm run dev` (no Netlify auth needed).
media_folder: "public/art"
public_folder: "/art"
site_url: https://kunstvoornepal.nl
logo_url: /img/tikkie-qr.svg

collections:
  # ── Kunstwerken: one file per artwork ──────────────────────────────
  - name: "artworks"
    label: "Kunstwerken"
    label_singular: "Kunstwerk"
    folder: "src/content/artworks"
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{number}}-{{slug}}"
    preview_path: "galerij"
    summary: "{{number}} · {{title}} — {{artist}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Kunstenaar", name: "artist", widget: "string" }
      - label: "Nummer"
        name: "number"
        widget: "number"
        value_type: "int"
        min: 101
        hint: "Uniek nummer vanaf 101. De koper vermeldt dit nummer in de betaling."
      - { label: "Foto", name: "image", widget: "image" }
      - { label: "Verkocht?", name: "sold", widget: "boolean", default: false, required: false }
      - { label: "Omschrijving", name: "body", widget: "markdown", required: false }

  # ── Verhaal: the front-page story ──────────────────────────────────
  - name: "verhaal"
    label: "Verhaal"
    files:
      - label: "Voorpagina-verhaal"
        name: "story"
        file: "src/content/story/story.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Intro (korte lead)", name: "lead", widget: "text" }
          - { label: "Verhaal", name: "body", widget: "markdown" }

  # ── Instellingen: global settings (Tikkie QR etc.) ─────────────────
  - name: "instellingen"
    label: "Instellingen"
    media_folder: "public/img"
    public_folder: "/img"
    files:
      - label: "Algemene instellingen"
        name: "global"
        file: "src/content/settings/global.json"
        fields:
          - { label: "Sitenaam", name: "siteTitle", widget: "string" }
          - { label: "Tikkie-QR-code (afbeelding)", name: "tikkieQr", widget: "image", hint: "De QR-afbeelding uit de Tikkie-app. Toont op de doneerpagina en in het Betaal-venster." }
          - { label: "Tikkie betaallink (URL)", name: "tikkieUrl", widget: "string", hint: "De link die getoond wordt bij 'Open betaallink'." }
          - { label: "Contact-e-mailadres", name: "contactEmail", widget: "string" }
          - { label: "Voettekst", name: "footerNote", widget: "text" }
